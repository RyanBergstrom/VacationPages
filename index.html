<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vacation Pages</title>
  <style>
    :root {
      --primary-color: #1A365D;
      --secondary-color: #2B6CB0;
      --background-color: #F7FAFC;
      --card-bg: #FFFFFF;
      --text-color: #2D3748;
      --vh: 1vh;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
      min-height: 100vh;
      min-height: calc(var(--vh, 1vh) * 100);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid #E2E8F0;
      text-align: center;
    }

    .controls-bar {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      align-items: center;
      padding: 0.75rem;
      background: var(--card-bg);
      border-bottom: 1px solid #E2E8F0;
    }

    select, button {
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #CBD5E0;
      background: white;
      cursor: pointer;
      min-height: 48px; /* Touch target optimization */
    }

    button {
      background-color: var(--secondary-color);
      color: white;
      border: none;
      font-weight: 600;
    }

    button:disabled {
      background-color: #A0AEC0;
      cursor: not-allowed;
    }

    main {
      flex: 1;
      padding: 1rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .stop-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 1rem;
    }

    .image-container {
      width: 100%;
      height: 300px;
      background-color: #E2E8F0;
      position: relative;
    }

    .stop-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 1.25rem;
    }

    .nav-footer {
      position: sticky;
      bottom: 0;
      background: var(--card-bg);
      padding: 1rem;
      border-top: 1px solid #E2E8F0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .progress-text {
      font-weight: 600;
      color: #4A5568;
    }
  </style>
</head>
<body>

  <header>
    <h1>Vacation Tour</h1>
  </header>

  <div class="controls-bar">
    <select id="stopDropdown" onchange="jumpToStop(this.value)">
      <option value="0">Stop 1</option>
    </select>
  </div>

  <main>
    <article class="stop-card">
      <div class="image-container">
        <!-- Path updated to relative; includes inline SVG fallback logic -->
        <img 
          id="currentImage"
          src="images/stop1.jpg" 
          alt="Vacation Stop Image" 
          class="stop-image"
          loading="lazy"
          onerror="handleImageError(this)"
        >
      </div>
      <div class="card-body">
        <h2 id="stopTitle">Destination</h2>
        <p id="stopDescription">Description text goes here.</p>
      </div>
    </article>
  </main>

  <footer class="nav-footer">
    <button id="prevBtn" onclick="navigate(-1)">Previous</button>
    <span id="progressIndicator" class="progress-text">1 / 1</span>
    <button id="nextBtn" onclick="navigate(1)">Next</button>
  </footer>

  <script>
    // Adjust height for mobile viewport browser bars
    function setViewportHeight() {
      let vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    window.addEventListener('resize', setViewportHeight);
    setViewportHeight();

    // Fallback handler: ensures an image element never displays as broken
    function handleImageError(img) {
      img.onerror = null; // Prevents infinite loop
      const title = document.getElementById('stopTitle')?.innerText || 'Image';
      const svgFallback = `
        <svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
          <rect width="100%" height="100%" fill="#EDF2F7"/>
          <path d="M260 170 L300 130 L340 170 L380 120 L440 200 L160 200 Z" fill="#CBD5E0"/>
          <circle cx="230" cy="130" r="20" fill="#CBD5E0"/>
          <text x="50%" y="75%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#718096">
            ${title} (Image Loading)
          </text>
        </svg>
      `;
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgFallback);
    }

    function jumpToStop(index) {
      // Custom jump logic
    }

    function navigate(direction) {
      // Custom navigation logic
    }
  </script>
</body>
</html>
